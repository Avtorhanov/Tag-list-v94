# Сборка Android-приложения Tag list (APK) на серверах GitHub.
# Запускается при каждом изменении в ветке main и вручную (Actions → Build APK → Run workflow).
# Готовый файл: раздел Releases → Tag-list.apk
# Постоянная ссылка на последнюю версию:
#   https://github.com/<логин>/<репозиторий>/releases/latest/download/Tag-list.apk
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.TAGLIST_KEYSTORE_BASE64 }}
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v4

      # Ключ подписи хранится только в секретах репозитория (Settings → Secrets and variables → Actions):
      #   TAGLIST_KEYSTORE_BASE64   — файл .jks в base64
      #   TAGLIST_KEYSTORE_PASSWORD — пароль хранилища
      #   TAGLIST_KEY_ALIAS         — псевдоним ключа (по умолчанию taglist)
      #   TAGLIST_KEY_PASSWORD      — пароль ключа (если пусто — как у хранилища)
      - name: Ключ подписи из секретов
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет TAGLIST_KEYSTORE_BASE64 — APK нечем подписать."
            exit 1
          fi
          # Пробелы и переводы строк (часто появляются при копировании с телефона) выбрасываем.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::Секрет TAGLIST_KEYSTORE_BASE64 повреждён: в строке есть символы, которых нет в base64. Вставьте содержимое файла TAGLIST_KEYSTORE_BASE64.txt заново."
            exit 1
          fi
          echo "TAGLIST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Проверка до Gradle: понятная причина видна прямо в Annotations на странице запуска.
      - name: Проверить ключ подписи
        env:
          TAGLIST_KEYSTORE_PASSWORD: ${{ secrets.TAGLIST_KEYSTORE_PASSWORD }}
          TAGLIST_KEY_ALIAS: ${{ secrets.TAGLIST_KEY_ALIAS }}
        run: |
          # Пароль без пробелов и переводов строк (лишние символы могли попасть при копировании).
          TAGLIST_KEYSTORE_PASSWORD=$(printf '%s' "$TAGLIST_KEYSTORE_PASSWORD" | tr -d '[:space:]')
          if [ -z "$TAGLIST_KEYSTORE_PASSWORD" ]; then
            echo "::error::Не задан секрет TAGLIST_KEYSTORE_PASSWORD."
            exit 1
          fi
          ALIAS="${TAGLIST_KEY_ALIAS:-taglist}"
          SIZE=$(stat -c %s "$TAGLIST_KEYSTORE_FILE")
          SUM=$(sha256sum "$TAGLIST_KEYSTORE_FILE" | cut -c1-12)
          if ! OUT=$(keytool -list -keystore "$TAGLIST_KEYSTORE_FILE" -storepass "$TAGLIST_KEYSTORE_PASSWORD" -alias "$ALIAS" 2>&1); then
            MSG=$(printf '%s\n' "$OUT" | grep -iE "error|exception" | tail -1)
            echo "::error::Ключ не открывается (файл ${SIZE} байт, sha256 ${SUM}…): ${MSG}"
            exit 1
          fi
          echo "Ключ в порядке: ${SIZE} байт, sha256 ${SUM}…, псевдоним ${ALIAS}"

      - name: Собрать APK
        working-directory: android
        env:
          TAGLIST_KEYSTORE_PASSWORD: ${{ secrets.TAGLIST_KEYSTORE_PASSWORD }}
          TAGLIST_KEY_ALIAS: ${{ secrets.TAGLIST_KEY_ALIAS }}
          TAGLIST_KEY_PASSWORD: ${{ secrets.TAGLIST_KEY_PASSWORD }}
        run: |
          # Пароли — без пробелов и переводов строк, как в шаге проверки.
          export TAGLIST_KEYSTORE_PASSWORD="$(printf '%s' "$TAGLIST_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          export TAGLIST_KEY_PASSWORD="$(printf '%s' "$TAGLIST_KEY_PASSWORD" | tr -d '[:space:]')"
          # Пустые необязательные секреты не должны перекрывать значения по умолчанию.
          if [ -z "$TAGLIST_KEY_ALIAS" ]; then unset TAGLIST_KEY_ALIAS; fi
          if [ -z "$TAGLIST_KEY_PASSWORD" ]; then unset TAGLIST_KEY_PASSWORD; fi
          set -o pipefail
          if ! bash ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Причину ошибки Gradle выносим в Annotations, чтобы не искать её в длинном логе.
            WHY=$(sed -n '/What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" | grep -vE '^\* (Try|What went wrong)' | grep -v '^\s*$' | head -6 | tr '\n' ' ')
            echo "::error::Gradle: ${WHY:-причина не найдена, см. лог шага}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Tag-list.apk"

      - name: Сохранить APK в результатах запуска
        uses: actions/upload-artifact@v4
        with:
          name: Tag-list-apk
          path: Tag-list.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v81.${{ github.run_number }}
          name: Tag list 81.${{ github.run_number }}
          body: |
            Android-приложение Tag list.
            Скачать: файл **Tag-list.apk** ниже → открыть на телефоне → «Установить».
            Обновление ставится поверх старой версии, данные сохраняются.

            ⚠️ 12.10.2026 сменился ключ подписи. Если обновление не устанавливается
            («Приложение не установлено»): в старой версии нажмите «Сохранить» (JSON),
            удалите приложение, установите этот APK и нажмите «Открыть» → выберите сохранённый файл.
          files: Tag-list.apk
          make_latest: true
