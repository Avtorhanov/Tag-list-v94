// Tag list — Android-приложение (WebView-оболочка над веб-версией из корня репозитория).
// Без сторонних библиотек: только Android SDK.
plugins {
    id 'com.android.application'
}

def webRoot = rootProject.file('..')          // корень репозитория с index.html, css/, js/
def ciBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

// Ключ подписи берётся ТОЛЬКО из переменных окружения (секреты GitHub Actions или локальная сборка).
// Сам ключ (*.jks) и пароли в репозиторий не кладутся.
def ksPath = System.getenv('TAGLIST_KEYSTORE_FILE')
def ksFile = ksPath ? file(ksPath) : null
def ksPass = System.getenv('TAGLIST_KEYSTORE_PASSWORD')
def ksAlias = System.getenv('TAGLIST_KEY_ALIAS') ?: 'taglist'
def ksKeyPass = System.getenv('TAGLIST_KEY_PASSWORD') ?: ksPass
def hasSigning = ksFile != null && ksFile.exists() && ksPass

gradle.taskGraph.whenReady { graph ->
    if (!hasSigning && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException('Нет ключа подписи: задайте TAGLIST_KEYSTORE_FILE и TAGLIST_KEYSTORE_PASSWORD (в CI — секреты репозитория).')
    }
}

android {
    namespace 'io.github.avtorhanov.taglist'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.avtorhanov.taglist'
        minSdk 24
        targetSdk 34
        versionCode 81000 + ciBuildNumber
        versionName "81.${ciBuildNumber}"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile ksFile
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [layout.buildDirectory.dir("generated/webassets").get().asFile]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Копируем веб-приложение в APK при каждой сборке (папка assets/www).
tasks.register('copyWebAssets', Sync) {
    from(webRoot) {
        include 'index.html', 'manifest.webmanifest', '*.png', '*.webp'
        include 'css/**', 'js/**'
        exclude '**/.gitkeep'
    }
    into layout.buildDirectory.dir("generated/webassets/www")
}
preBuild.dependsOn 'copyWebAssets'
