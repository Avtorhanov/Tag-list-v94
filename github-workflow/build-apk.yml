# Сборка Android-приложения Tag list (APK) на серверах GitHub.
# Запускается при каждом изменении в ветке main и вручную (Actions → Build APK → Run workflow).
# Готовый файл: раздел Releases → Tag-list.apk
# Постоянная ссылка на последнюю версию:
#   https://github.com/<логин>/<репозиторий>/releases/latest/download/Tag-list.apk
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.TAGLIST_KEYSTORE_BASE64 }}
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v4

      # Ключ подписи хранится только в секретах репозитория (Settings → Secrets and variables → Actions):
      #   TAGLIST_KEYSTORE_BASE64   — файл .jks в base64
      #   TAGLIST_KEYSTORE_PASSWORD — пароль хранилища
      #   TAGLIST_KEY_ALIAS         — псевдоним ключа (по умолчанию taglist)
      #   TAGLIST_KEY_PASSWORD      — пароль ключа (если пусто — как у хранилища)
      - name: Ключ подписи из секретов
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет TAGLIST_KEYSTORE_BASE64 — APK нечем подписать."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TAGLIST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Собрать APK
        working-directory: android
        env:
          TAGLIST_KEYSTORE_PASSWORD: ${{ secrets.TAGLIST_KEYSTORE_PASSWORD }}
          TAGLIST_KEY_ALIAS: ${{ secrets.TAGLIST_KEY_ALIAS }}
          TAGLIST_KEY_PASSWORD: ${{ secrets.TAGLIST_KEY_PASSWORD }}
        run: |
          # Пустые необязательные секреты не должны перекрывать значения по умолчанию.
          if [ -z "$TAGLIST_KEY_ALIAS" ]; then unset TAGLIST_KEY_ALIAS; fi
          if [ -z "$TAGLIST_KEY_PASSWORD" ]; then unset TAGLIST_KEY_PASSWORD; fi
          bash ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Tag-list.apk"

      - name: Сохранить APK в результатах запуска
        uses: actions/upload-artifact@v4
        with:
          name: Tag-list-apk
          path: Tag-list.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v81.${{ github.run_number }}
          name: Tag list 81.${{ github.run_number }}
          body: |
            Android-приложение Tag list.
            Скачать: файл **Tag-list.apk** ниже → открыть на телефоне → «Установить».
            Обновление ставится поверх старой версии, данные сохраняются.
          files: Tag-list.apk
          make_latest: true
